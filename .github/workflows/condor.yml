# Runs the SPY condor bot (scripts/condor.ts) around the clock. Each run
# (scripts/condor-session.sh) steps the bot in the last half hour of every
# trading day, where it opens the next condor, and after the official close
# to settle; jobs are limited to six hours, so before its limit each run
# starts a fresh one to take over (workflow_dispatch, which GitHub doesn't
# skip). The chain needs nothing else to keep going. The schedule below only
# restarts it if GitHub ever loses a run. Runs share one concurrency group,
# so a scheduled run that finds the chain running waits in line (GitHub keeps
# only the newest waiting run), and exactly one run carries the chain on.
# Its state is saved on the fund-data branch; the deploy workflow publishes it.
name: Condor bot

on:
  schedule:
    # Fallback only (see above): every 30 minutes, off the crowded :00/:30.
    - cron: "17,47 * * * *"
  workflow_dispatch:
    inputs:
      times:
        description: "New York times to step the bot (HH:MM, space-separated; blank = the usual close times)"
        required: false
        default: ""
      budget_min:
        description: "Minutes to wait before handing off to a fresh run (for testing; blank = 335)"
        required: false
        default: ""

permissions:
  contents: write # push the bot's state to the fund-data branch
  actions: write # hand off to a fresh run before the time limit

concurrency:
  group: condor-state
  cancel-in-progress: false

jobs:
  step:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/checkout@v5
        with:
          ref: fund-data
          path: fund-state
      - name: Run the bot through the close
        run: scripts/condor-session.sh
        env:
          FUND_DIR: fund-state
          TIMES: ${{ inputs.times }}
          BUDGET_MIN: ${{ inputs.budget_min || 335 }}
          GH_TOKEN: ${{ github.token }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          HANDOFF: gh workflow run condor.yml -R ${{ github.repository }} --ref main
          PUBLISH: gh workflow run demo.yml -R ${{ github.repository }} --ref main
