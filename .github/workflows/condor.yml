# Runs the SPY condor bot (scripts/condor.ts) through each trading day. One
# run started any time during the day stays alive until after the close
# (scripts/condor-session.sh): it steps the bot in the last half hour, where
# it opens the next condor, and after the official close to settle. GitHub
# skips scheduled runs when busy (all of them on 2026-10-13), so this has many
# schedule slots through the day and is also started by the deploy workflow
# (workflow_dispatch, which GitHub doesn't skip) and by a daily Claude
# routine. Runs share one concurrency group, so only one steps the bot at a
# time; one that starts after the close just steps once and exits.
# Its state is saved on the fund-data branch; the deploy workflow publishes it.
name: Condor bot

on:
  schedule:
    # Every 20 minutes, 13:07-21:47 UTC (about 8am-5:45pm New York time in
    # either daylight saving or standard time; the script reads the New York
    # clock itself).
    - cron: "7,27,47 13-21 * * 1-5"
  workflow_dispatch:
    inputs:
      times:
        description: "New York times to step the bot (HH:MM, space-separated; blank = the usual close times)"
        required: false
        default: ""

permissions:
  contents: write # push the bot's state to the fund-data branch

concurrency:
  group: condor-state
  cancel-in-progress: false

jobs:
  step:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/checkout@v5
        with:
          ref: fund-data
          path: fund-state
      - name: Run the bot through the close
        run: scripts/condor-session.sh
        env:
          FUND_DIR: fund-state
          TIMES: ${{ inputs.times }}
          BUDGET_MIN: 335
